name: frontend
description: "A new Flutter project."

# Prevent accidental publishing to pub.dev
publish_to: 'none'

# Versioning
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  camera_windows: ^0.2.0

  # Core packages
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.3.0

  # JWT decoding
  jwt_decoder: ^2.0.1

  # Image capture (Web + Mobile)
  image_picker: ^1.0.4
  mime: ^1.0.4

  # Camera and scanner (uncommented for use)
  camera: ^0.12.0+2
  mobile_scanner: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
